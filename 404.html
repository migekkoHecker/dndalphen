<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina niet gevonden | DND Alphen</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root {
	--leather: #1c120b;
	--wood: #2d1d12;
	--wood-line: #4a3220;
	--parch: #d8c196;
	--parch-dark: #c4a873;
	--ink: #2a1a0e;
	--ink-soft: #5a4128;
	--wax: #8f2b1e;
	--wax-light: #b03a2a;
	--gold: #c19a4e;
	--text: #e6d5b4;
	--muted: #b5a07c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
	font-family: "IM Fell English", Georgia, "Times New Roman", serif;
	font-size: 1.28rem;
	line-height: 1.55;
	color: var(--text);
	background:
		radial-gradient(ellipse at 50% 0%, #3a2616 0%, transparent 60%),
		repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 120px),
		var(--leather);
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.wrap { width: min(100% - 40px, 1060px); margin-inline: auto; }

/* header */
header { background: var(--wood); border-bottom: 3px double var(--wood-line); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 70px; }
.logo { font-family: "Pirata One", "IM Fell English", serif; font-size: 1.9rem; text-decoration: none; letter-spacing: .02em; }
.nav { display: flex; align-items: center; gap: 26px; font-family: "IM Fell English SC", serif; font-size: 1.05rem; }
.nav a { text-decoration: none; color: var(--muted); }
.nav a:hover { color: var(--text); }
.nav a.seal-link { color: #fff; }

/* wax-seal style button */
.btn {
	display: inline-block;
	font-family: "IM Fell English SC", serif;
	font-size: 1.15rem;
	color: #f6e7cf;
	background: radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 65%, #6d1f15);
	padding: 12px 30px;
	border-radius: 8px;
	box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 3px 0 rgba(0,0,0,.35);
	text-decoration: none;
	transition: transform .12s;
}
.btn:hover { transform: translateY(-2px) rotate(-1deg); }
.btn-sm { padding: 7px 20px; font-size: 1rem; }

/* parchment */
.parch {
	background:
		radial-gradient(ellipse at 20% 15%, rgba(255,240,200,.35), transparent 55%),
		radial-gradient(ellipse at 90% 100%, rgba(120,80,30,.35), transparent 55%),
		var(--parch);
	color: var(--ink);
}

/* hero */
.hero { padding: 70px 0 90px; }
.hero .wrap { display: grid; grid-template-columns: 1.3fr .7fr; gap: 40px; align-items: center; }
.scroll-wrap { filter: drop-shadow(0 14px 18px rgba(0,0,0,.55)); }
.scroll {
	padding: 54px 52px 56px;
	clip-path: polygon(0 3%, 4% 0, 12% 2%, 24% 0, 38% 2%, 52% 0, 66% 2%, 80% 0, 93% 2%, 100% 0, 99% 18%, 100% 36%, 98.5% 55%, 100% 74%, 99% 100%, 90% 98%, 76% 100%, 60% 98%, 44% 100%, 28% 98.5%, 14% 100%, 5% 98%, 0 100%, 1.2% 78%, 0 58%, 1.5% 38%, 0 20%);
}
h1 { font-family: "Pirata One", "IM Fell English", serif; font-weight: 400; font-size: clamp(2.5rem, 5vw, 3.9rem); line-height: 1; color: #3a1d0c; }
.scroll p { margin-top: 22px; max-width: 30em; }
.scroll p::first-letter {
	font-family: "Pirata One", serif;
	float: left;
	font-size: 4.4rem;
	line-height: .8;
	padding: 6px 10px 0 0;
	color: var(--wax);
}
.scroll .btn { margin-top: 28px; }
.scroll small { display: block; margin-top: 14px; font-style: italic; color: var(--ink-soft); font-size: 1rem; }
.die-wrap { text-align: center; }
.die-btn { display: block; width: 100%; max-width: 280px; margin-inline: auto; padding: 0; border: 0; background: none; cursor: pointer; transform: rotate(-9deg); filter: drop-shadow(0 10px 14px rgba(0,0,0,.5)); transition: transform .2s; }
.die-btn svg { display: block; width: 100%; height: auto; }
.die-btn:hover { transform: rotate(-4deg) scale(1.03); }
.die-btn.rolling { animation: roll .7s ease-in-out; }
@keyframes roll { 0% { transform: rotate(-9deg) scale(1); } 50% { transform: rotate(171deg) scale(1.12); } 100% { transform: rotate(351deg) scale(1); } }

/* sections */
section { padding: 72px 0; }
h2 { font-family: "Pirata One", "IM Fell English", serif; font-weight: 400; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.05; margin-bottom: 22px; }
.prose { max-width: 38em; }
.prose p + p { margin-top: 1em; }
.prose p { color: var(--text); }
.divider { height: 14px; border: 0; background: repeating-linear-gradient(90deg, var(--wood-line) 0 10px, transparent 10px 18px); opacity: .7; }

/* prikbord */
.board {
	background:
		radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.25), transparent 70%),
		var(--wood);
	border-top: 3px double var(--wood-line);
	border-bottom: 3px double var(--wood-line);
}
.notes {
	display: grid;
	grid-template-columns: repeat(12, 1fr);
	gap: 34px 26px;
	align-items: start;
	margin-top: 40px;
}
.note {
	position: relative;
	padding: 34px 24px 24px;
	box-shadow: 0 10px 16px rgba(0,0,0,.45);
	font-size: 1.12rem;
	line-height: 1.4;
	transform: translate(var(--x, 0), var(--y, 0)) rotate(var(--r, 0deg));
}
.note::before {
	content: "";
	position: absolute;
	top: 9px; left: 50%;
	width: 15px; height: 15px;
	margin-left: -7px;
	border-radius: 50%;
	background: radial-gradient(circle at 35% 30%, #d36a58, var(--wax) 70%);
	box-shadow: 0 3px 3px rgba(0,0,0,.45);
}
.note h3 { font-family: "Pirata One", serif; font-weight: 400; font-size: 1.7rem; line-height: 1.05; margin-bottom: 8px; color: #3a1d0c; }
.note.joke { color: var(--ink); font-size: 1.05rem; padding: 32px 18px 18px; }
.note.joke h3 { font-size: 1.35rem; }
.note.joke.dark { background-color: var(--parch-dark); }
.note.joke.pale { background-color: #e4d3ae; }
.note.joke.tape::before { width: 56px; height: 20px; margin-left: -28px; top: -8px; border-radius: 2px; background: rgba(230,215,170,.75); box-shadow: 0 1px 2px rgba(0,0,0,.3); transform: rotate(-4deg); }
.note.joke.nail::before { background: radial-gradient(circle at 35% 30%, #9a9a9a, #4a4a4a 70%); width: 11px; height: 11px; margin-left: -5px; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w5 { grid-column: span 5; }

/* steps */
ol.steps { list-style: none; counter-reset: s; max-width: 38em; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 3.2rem 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px dashed var(--wood-line); }
ol.steps li:last-child { border-bottom: 0; }
ol.steps li::before {
	content: counter(s);
	display: grid; place-items: center;
	width: 3rem; height: 3rem;
	font-family: "Pirata One", serif; font-size: 1.7rem;
	color: #f6e7cf;
	background: radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 70%);
	border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;
}
ol.steps strong { display: block; font-weight: 400; font-size: 1.4rem; }
ol.steps span { color: var(--muted); }

/* faq */
details { max-width: 38em; border-bottom: 1px solid var(--wood-line); }
details:first-of-type { border-top: 1px solid var(--wood-line); }
summary { cursor: pointer; padding: 16px 0; font-size: 1.3rem; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--gold); font-size: 1.6rem; line-height: 1; }
details[open] summary::after { content: "–"; }
details p { padding-bottom: 18px; color: var(--muted); }

/* final call */
.final { padding: 64px 0 76px; }
.final .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 26px 48px; }
.final h2 { margin: 0; max-width: 14em; }

footer { background: var(--wood); border-top: 3px double var(--wood-line); padding: 26px 0; color: var(--muted); font-size: 1rem; }
footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; }

.mail { color: var(--gold); text-underline-offset: 3px; }
footer a { text-underline-offset: 3px; }
@media (max-width: 820px) {
	}

@media (max-width: 820px) {
	.hero { padding: 40px 0 60px; }
	.hero .wrap { grid-template-columns: 1fr; }
	.scroll { padding: 40px 28px 44px; }
	.die-wrap { order: -1; }
	.die-btn { max-width: 170px; }
	.nav a:not(.seal-link) { display: none; }
	section { padding: 52px 0; }
	.notes { grid-template-columns: 1fr 1fr; gap: 30px 18px; }
	.w3, .w4, .w5 { grid-column: span 1; }
	.note.real { grid-column: 1 / -1; }
	.note { --x: 0px !important; }
}
@media (prefers-reduced-motion: reduce) {
	html { scroll-behavior: auto; }
	.btn { transition: none; }
	.die-btn { transition: none; }
}

.lost { padding: 110px 0 120px; }
.lost h1 { font-size: clamp(3rem, 8vw, 5.5rem); }
.lost p { margin-top: 20px; max-width: 28em; color: var(--muted); }
.lost .buttons { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 14px; }
.lost .btn.alt { background: var(--wood); box-shadow: inset 0 0 0 2px var(--wood-line), 0 3px 0 rgba(0,0,0,.35); }
</style>
</head>
<body>
<header>
	<div class="wrap">
		<a class="logo" href="/">DND Alphen</a>
		<nav class="nav" aria-label="Hoofdnavigatie">
			<a class="btn btn-sm seal-link" href="https://discord.gg/qmmmthWu42">Discord</a>
		</nav>
	</div>
</header>

<main>
	<section class="lost">
		<div class="wrap">
			<h1>Verkeerd afgeslagen</h1>
			<p>Deze pagina bestaat niet. Misschien heeft een mimic hem opgegeten.</p>
			<div class="buttons">
				<a class="btn" href="/">Terug naar de startpagina</a>
				<a class="btn alt" href="https://discord.gg/qmmmthWu42">Naar de Discord</a>
			</div>
		</div>
	</section>
</main>

<footer>
	<div class="wrap">
		<div>© 2026 DND Alphen</div>
		<div>Vragen? Stuur een mail naar <a href="mailto:email@dndalphen.nl">email@dndalphen.nl</a></div>
	</div>
</footer>
</body>
</html>
